<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Commit Generator icon</title>
  <desc id="desc">A generated Git commit message with branch nodes and a sparkle.</desc>
  <defs>
    <linearGradient id="bg" x1="40" y1="20" x2="220" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1c2633"/>
      <stop offset="1" stop-color="#101318"/>
    </linearGradient>
    <linearGradient id="accent" x1="56" y1="60" x2="196" y2="194" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#36d399"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <path d="M197 62l7 17 18 7-18 7-7 18-7-18-18-7 18-7 7-17z" fill="#f8fafc" opacity="0.95"/>
  <path d="M176 38l4 10 10 4-10 4-4 10-4-10-10-4 10-4 4-10z" fill="#36d399"/>

  <g filter="url(#shadow)">
    <rect x="54" y="58" width="132" height="154" rx="18" fill="#f8fafc"/>
    <rect x="72" y="86" width="78" height="10" rx="5" fill="#1f2937" opacity="0.9"/>
    <rect x="72" y="110" width="96" height="9" rx="4.5" fill="#64748b" opacity="0.72"/>
    <rect x="72" y="131" width="74" height="9" rx="4.5" fill="#64748b" opacity="0.72"/>
    <rect x="72" y="152" width="86" height="9" rx="4.5" fill="#64748b" opacity="0.72"/>
  </g>

  <path d="M92 175h34c20 0 26-13 26-31v-28" fill="none" stroke="url(#accent)" stroke-width="12" stroke-linecap="round"/>
  <path d="M92 116v59" fill="none" stroke="#111827" stroke-width="12" stroke-linecap="round" opacity="0.82"/>
  <circle cx="92" cy="116" r="15" fill="#36d399"/>
  <circle cx="92" cy="175" r="15" fill="#3b82f6"/>
  <circle cx="152" cy="116" r="15" fill="#f8fafc"/>
  <circle cx="152" cy="116" r="8" fill="#36d399"/>

  <path d="M107 175l12 12 28-33" fill="none" stroke="#f8fafc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
